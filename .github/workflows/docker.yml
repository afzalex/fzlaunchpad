name: Docker

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read version from package.json
        id: read_version
        uses: ./.github/actions/read-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64, linux/arm64
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fzlaunchpad:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fzlaunchpad:${{ steps.read_version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fzlaunchpad:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fzlaunchpad:latest
          cache-to: type=inline
