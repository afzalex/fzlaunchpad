name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download ZIP artifact
        uses: actions/download-artifact@v8
        with:
          name: fzlaunchpad-zip
          path: .

      - name: Download tar.gz artifact
        uses: actions/download-artifact@v8
        with:
          name: fzlaunchpad-targz
          path: .

      - name: Update latest release
        uses: ./.github/actions/update-latest-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if semver release tag already exists
        id: tag_check
        uses: ./.github/actions/check-release-tag
        with:
          version: ${{ needs.build.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create semver GitHub Release
        if: steps.tag_check.outputs.exists != 'true'
        uses: ./.github/actions/create-release
        with:
          tag: ${{ steps.tag_check.outputs.tag }}
          version: ${{ needs.build.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
