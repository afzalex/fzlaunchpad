name: Update latest release
description: Move the latest tag to the current commit and refresh release assets

inputs:
  zip-path:
    description: Path to the ZIP archive
    required: false
    default: fzlaunchpad.zip
  targz-path:
    description: Path to the tar.gz archive
    required: false
    default: fzlaunchpad.tar.gz
  github-token:
    description: GitHub token with contents write access
    required: true

runs:
  using: composite
  steps:
    - name: Update latest tag and release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ZIP_PATH: ${{ inputs.zip-path }}
        TARGZ_PATH: ${{ inputs.targz-path }}
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git tag -f latest "${GITHUB_SHA}"
        git push -f origin refs/tags/latest

        if gh release view latest >/dev/null 2>&1; then
          gh release upload latest "${ZIP_PATH}" "${TARGZ_PATH}" --clobber
          gh release edit latest \
            --title "Latest Build" \
            --notes "Automated build from main branch. Commit ${GITHUB_SHA}." \
            --latest
        else
          gh release create latest "${ZIP_PATH}" "${TARGZ_PATH}" \
            --title "Latest Build" \
            --notes "Automated build from main branch. Commit ${GITHUB_SHA}." \
            --latest
        fi
