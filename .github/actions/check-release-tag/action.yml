name: Check release tag
description: Check whether a semver GitHub release tag already exists

inputs:
  version:
    description: Package version from package.json
    required: true
  github-token:
    description: GitHub token with contents read access
    required: true

outputs:
  tag:
    description: Release tag for the version
    value: ${{ steps.check.outputs.tag }}
  exists:
    description: Whether the release tag already exists
    value: ${{ steps.check.outputs.exists }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ inputs.version }}
      run: |
        TAG="v${VERSION}"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        if gh release view "${TAG}" >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Release ${TAG} already exists, skipping."
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "Will create release ${TAG}."
        fi
